:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

<body>
<div id="root"></div>
<script type="text/babel">
const { useReducer, useEffect, useRef, useState, useMemo } = React;

const SUBJECT_COLORS = [
  { hex: "#3654E8", soft: "#E3E9FE" }, { hex: "#2F8FD1", soft: "#E1EFFB" },
  { hex: "#2AA7A0", soft: "#DFF4F1" }, { hex: "#8A5FD1", soft: "#EEE6FB" },
  { hex: "#4C8DF0", soft: "#E2EFFE" }, { hex: "#23A6C9", soft: "#DEF3F8" },
  { hex: "#6C5CE0", soft: "#EAE6FC" }, { hex: "#4472B0", soft: "#E3EAF5" },
];
const PRIORITY_LEVELS = [
  { label: "최우선", weight: 5 }, { label: "높음", weight: 4 }, { label: "보통", weight: 3 },
  { label: "낮음", weight: 2 }, { label: "여유", weight: 1 },
];
const PRIORITY_TIPS = {
  최우선: "일주일에 4번 배정돼요. 매번 문제풀이로 기억을 확인하고, 시험 전날은 새 내용보다 요약 노트 위주로 가볍게 마무리하세요.",
  높음: "일주일에 3번 배정돼요. 개념 정리를 먼저 끝낸 뒤, 기출·모의문제로 적용력을 다지는 데 시간을 쓰세요.",
  보통: "일주일에 2번 배정돼요. 핵심 개념 위주로 정리하고, 시험이 가까워질수록 문제풀이 비중을 늘려보세요.",
  낮음: "일주일에 한 번 배정돼요. 배정된 날에 그 주 진도를 확실히 끝내두세요.",
  여유: "평소엔 배정하지 않고 시험 전날에만 나와요. 그날 가볍게 훑어보는 걸로 충분해요.",
};
const DOW = ["일", "월", "화", "수", "목", "금", "토"];
const WEEKDAY_ORDER = [1, 2, 3, 4, 5, 6, 0];
const PLAN_KEY = "ppaplan:v1", REC_KEY = "studyRecords";

const addDays = (b, n) => { const d = new Date(b); d.setDate(d.getDate() + n); return d; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const fmt = (d) => `${d.getMonth() + 1}.${d.getDate()}`;
const dateKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const sum = (arr, f) => arr.reduce((x, a) => x + f(a), 0);
const r1 = (n) => Math.round(n * 10) / 10;
const formatMinutes = (m) => (Number.isInteger(m) ? `${m}` : m.toFixed(1));
const achievementColor = (pct) => (pct >= 100 ? "#45B07C" : pct >= 50 ? "#3B5BFA" : "#E2735C");
const priorityWeight = (label) => { const f = PRIORITY_LEVELS.find((p) => p.label === label); return f ? f.weight : 3; };

function formatHoursLabel(hours) {
  if(hours>0 && hours*60<1) return String(Math.max(1,Math.round(hours*3600))) + '초';
  const total = Math.round(hours * 60), h = Math.floor(total / 60), m = total % 60;
  if (h === 0 && m === 0) return "0분";
  if (h === 0) return `${m}분`;
  if (m === 0) return `${h}시간`;
  return `${h}시간 ${m}분`;
}
function formatTime(s) {
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), x = s % 60, p = (n) => String(n).padStart(2, "0");
  return h > 0 ? `${p(h)}:${p(m)}:${p(x)}` : `${p(m)}:${p(x)}`;
}

const storageIssues = [], protectedStorage = new Set();
function readRecovery(){try{return Object.fromEntries(Object.keys(localStorage).filter(k=>k.includes(":recovery:")).map(k=>[k,localStorage.getItem(k)]));}catch(e){return {};}}
function backupStorage(k) {try {const raw=localStorage.getItem(k);if(raw!==null)localStorage.setItem(k+':recovery:'+Date.now(),raw);return true;} catch(e){protectedStorage.add(k);storageIssue('원본 백업을 저장하지 못해 '+k+' 자동 저장을 중단했어요. 먼저 데이터 내보내기를 해 주세요.');return false;}}

function storageIssue(message) { storageIssues.push(message); window.dispatchEvent(new Event('storageissue')); }
function readJSON(k, fb) { try { const r = localStorage.getItem(k); return r ? JSON.parse(r) : fb; } catch (e) { storageIssue(k + ' 데이터를 읽지 못했어요. 원본은 복구용 키에 보관하며, 입력값을 확인해 주세요.'); backupStorage(k); return fb; } }
function writeJSON(k, v) { if(protectedStorage.has(k))return false; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { storageIssue('저장하지 못했어요. 브라우저 저장 공간 또는 저장 차단 설정을 확인하고, 데이터 내보내기로 백업해 주세요.'); return false; } return true; }

function buildExamDays(start, len) {
  const n = Number(len);
  if (!validDate(start) || !Number.isInteger(n) || n < 1 || n > 30) return [];
  const s = new Date(start + "T00:00:00");
  return Array.from({ length: Math.min(n, 30) }, (_, i) => ({ dayNumber: i + 1, date: addDays(s, i) }));

function buildWeekdayAssignment(rotateSubjects) {
  const assignment = { 0: [], 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };
  rotateSubjects.forEach((s, idx) => {
    const appearances = Math.min(7, Math.max(1, priorityWeight(s.priority) - 1));
    const offset = (idx * 2) % 7;
    const days = new Set();
    for (let i = 0; i < appearances; i++) days.add((((Math.round((i * 7) / appearances) + offset) % 7) + 7) % 7);
    let f = 0;
    while (days.size < appearances && f < 7) { days.add((offset + f) % 7); f++; }
    days.forEach((d) => assignment[d].push(s));
  });
  return assignment;
}

const TIMER_KEY = "ppaplan:timer";

function initTimer() {

  if (!Array.isArray(raw) || rs.length!==raw.length || JSON.stringify(rs)!==JSON.stringify(raw)) {backupStorage(REC_KEY);storageIssue('손상된 공부 기록을 제외했어요. 원본 백업을 확인해 주세요.');}

    const acc = validNumber(sv.accMs,0,1e12) ? Number(sv.accMs) : 0;
    const running = sv.mode === "running" && Number.isFinite(sv.startTs) && sv.startTs <= Date.now() && sv.startTs > 0;
    const el = running ? acc + Date.now() - sv.startTs : acc;
    const intervals = Array.isArray(sv.intervals) ? sv.intervals.filter(v=>Array.isArray(v)&&v.length===2&&Number.isFinite(v[0])&&Number.isFinite(v[1])&&v[1]>=v[0]) : [];

// 시작 시각 기준으로 계산해서 탭 전환·화면 꺼짐·새로고침에도 시간이 밀리지 않음
function timerReducer(s, a) {
  const now = a.now ?? Date.now();
  switch (a.type) {
    case "SELECT": return s.mode === "idle" ? { ...s, selId: a.id } : s;
    case "START": return s.mode === "running" ? s : { ...s, subject:a.subject || s.subject, mode: "running", startTs: now };
    case "PAUSE": {
      if (s.mode !== "running") return s;
      const acc = s.accMs + now - s.startTs;
      return { ...s, intervals:[...(s.intervals||[]),[s.startTs,now]], mode: "paused", accMs: acc, startTs: null, elapsedSeconds: Math.floor(acc / 1000) };
    }
    case "TICK": return s.mode !== "running" ? s : { ...s, elapsedSeconds: Math.floor((s.accMs + now - s.startTs) / 1000) };
    case "DISCARD": return { ...s, intervals:[], subject:null, mode: "idle", accMs: 0, startTs: null, elapsedSeconds: 0, restored: false };
    case "FINISH": {
      const intervals=[...(s.intervals||[]),...(s.mode==='running'?[[s.startTs,now]]:[])];
      const subject=a.subject || s.subject;
      const base={...s,mode:'idle',intervals:[],subject:null,accMs:0,startTs:null,elapsedSeconds:0,restored:false};
      return {...base,records:[...s.records,...(subject?splitIntervals(intervals,subject):[])]};
    }
    case "DELETE_RECORD": return { ...s, records: s.records.filter((_, i) => i !== a.index) };
    default: return s;
  }
}

                )}

                {history.length > 0 && (
                  <>
                    <h3>지난 공부 기록</h3>
                    {history.map((k) => (
                      <div key={k} className="hist"><span>{k.slice(5).replace("-", ".")}</span><span>{formatMinutes(r1(byDate[k]))}분</span></div>
                    ))}
                  </>
                )}
              </>
            )}
          </div>
        )}

        {tab === "stats" && (
          <div>
            <h2>공부 통계</h2>
            <div className="stat-cards">
              <div className="sc"><b>{formatMinutes(todayMin)}분</b><span>오늘</span></div>
              <div className="sc"><b>{formatHoursLabel(weekMin / 60)}</b><span>이번 주</span></div>
              <div className="sc"><b>{streak}일</b><span>연속 공부</span></div>
            </div>
            <h3>이번 주 (월~일, 단위: 분)</h3>
            <div className="wkc">
              {weekData.map((w) => (
                <div key={w.k} className={"wcol" + (w.isToday ? " today" : "")}>
                  <small>{w.min > 0 ? formatMinutes(w.min) : ""}</small>
                  <div className="wbar" style={{ height: Math.round((w.min / weekMax) * 80) + "%" }} />
                  <small>{w.label}</small>
                </div>
              ))}
            </div>
            <h3>과목별 누적</h3>
            {subjStats.length === 0 ? (
              <p className="muted">과목을 추가하면 과목별 통계가 나와요.</p>
            ) : (
              subjStats.map((v) => (
                <div key={v.x.id} className="ss">
                  <div className="ss-h">
                    <span><i className="dot" style={{ background: v.x.color.hex }} />{v.x.name}</span>
                    <span>누적 {formatHoursLabel(v.hours)}{v.pct !== null ? ` · 계획 대비 ${v.pct}%` : ""}</span>
                  </div>
                  <div className="bar2"><b style={{ width: Math.min(100, v.pct || 0) + "%", background: achievementColor(v.pct || 0) }} /></div>
                </div>
              ))
            )}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
